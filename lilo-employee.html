<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>VYRA Personal LILO</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#07152f}iframe{display:block}</style></head><body><iframe id="app" src="lilo.html?v=20260922-personal1"></iframe><script>const q=new URLSearchParams(location.search),name=q.get('employee'),f=document.getElementById('app');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;if(!name)return;function lock(){try{if(typeof w.emp==='undefined')return false;w.emp=name;d.querySelectorAll('.empnav button[data-emp]').forEach(b=>{b.style.display=b.dataset.emp===name?'inline-flex':'none';b.classList.toggle('active',b.dataset.emp===name)});const attendance=[...d.querySelectorAll('.empnav button')].find(b=>b.textContent.includes('Attendance'));if(attendance)attendance.style.display='inline-flex';d.getElementById('employeeView')?.classList.add('active');d.getElementById('attendanceView')?.classList.remove('active');const label=d.getElementById('empLabel');if(label)label.textContent=name.toUpperCase()+' • PERSONAL LILO';const title=d.getElementById('logTitle');if(title)title.textContent=name+' — LILO History';if(typeof w.loadEOD==='function')w.loadEOD();if(typeof w.renderPersonal==='function')w.renderPersonal();return true}catch(e){return false}}if(!lock()){const t=setInterval(()=>{if(lock())clearInterval(t)},100);setTimeout(()=>clearInterval(t),10000)}};</script></body></html>
