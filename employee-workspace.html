<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>VYRA Employee Workspace</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="hub" src="index.html?v=20260922-canonical1" title="VYRA Data Hub"></iframe><script>const hub=document.getElementById('hub');let refreshBusy=false;async function refreshSharedPipeline(){if(refreshBusy)return;try{const w=hub.contentWindow;if(typeof w.syncFromServer==='function'){refreshBusy=true;await w.syncFromServer(false)}}catch(e){console.warn('Shared pipeline refresh skipped',e)}finally{refreshBusy=false}}hub.addEventListener('load',function(){try{const d=this.contentDocument;const old=d.getElementById('country-enhancement-loader');if(old)old.remove();const s=d.createElement('script');s.id='country-enhancement-loader';s.src='country-enhancement.js?v=20260922-canonical1';s.onload=async()=>{await refreshSharedPipeline();setTimeout(refreshSharedPipeline,1200)};d.body.appendChild(s)}catch(e){console.error('Enhancement could not load',e)}});window.addEventListener('focus',refreshSharedPipeline);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshSharedPipeline()});setInterval(refreshSharedPipeline,10000);</script></body></html>
