<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>VYRA Employee Workspace</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="hub" src="index.html?v=20260922-inquiries1" title="VYRA Data Hub"></iframe><script>const hub=document.getElementById('hub');let refreshBusy=false;async function refreshSharedPipeline(){if(refreshBusy)return;try{const w=hub.contentWindow;if(typeof w.syncFromServer==='function'){refreshBusy=true;await w.syncFromServer(false)}}catch(e){}finally{refreshBusy=false}}function addBlessing(d,w){try{const nav=d.querySelector('.empnav');if(!nav)return false;const name='Blessing Chisom Eze';if(!nav.querySelector('[data-emp="Blessing Chisom Eze"]')){const b=d.createElement('button');b.className='tab';b.dataset.emp=name;b.textContent=name;b.onclick=function(){if(typeof w.pickEmp==='function')w.pickEmp(this)};const att=[...nav.querySelectorAll('button')].find(x=>x.textContent.includes('Attendance'));att?nav.insertBefore(b,att):nav.appendChild(b)}const filter=d.getElementById('empFilter');if(filter&&![...filter.options].some(o=>o.value===name)){const o=d.createElement('option');o.value=name;o.textContent=name;filter.appendChild(o)}try{if(Array.isArray(w.EMP)&&!w.EMP.includes(name))w.EMP.push(name)}catch(e){}return true}catch(e){return false}}function cleanOutreach(d){try{const out=d.getElementById('outreach');if(!out)return;const p=out.querySelector('h1+ p');if(p)p.textContent='Send outreach email directly from hello@vyracollective.org, view incoming replies, and keep activity in the shared lead record.';const grid=out.querySelector('.connectgrid');if(grid){[...grid.querySelectorAll('.connectcard')].forEach(c=>{const h=c.querySelector('h3')?.textContent.trim();if(h==='Facebook Page'||h==='Instagram')c.remove()});grid.style.gridTemplateColumns='1fr'}const channel=d.getElementById('outChannel');if(channel){[...channel.options].forEach(o=>{if(o.value==='Facebook'||o.value==='Instagram'||o.text==='Facebook'||o.text==='Instagram')o.remove()});channel.value='Email'}}catch(e){}}function removeUnusedTabs(d){try{d.querySelectorAll('a,button').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();const href=(el.getAttribute('href')||'').toLowerCase();if(t.includes('video review')||href.includes('video-review')||t.includes('client start-up')||t.includes('client startup')||t.includes('client start up'))el.remove()})}catch(e){}}function cleanNav(d){try{const names=[['Lead Pipeline','Lead Pipeline'],['VYRA Calls','Vyra Calls'],['Outreach Hub','Outreach Hub'],['LILO','Lilo']];d.querySelectorAll('button,a').forEach(el=>{const raw=(el.textContent||'').trim();for(const [match,label] of names){if(raw.toLowerCase().includes(match.toLowerCase())){el.textContent=label;break}}})}catch(e){}}function loadPagination(d){try{if(d.getElementById('lead-pagination-loader'))return;const s=d.createElement('script');s.id='lead-pagination-loader';s.src='lead-pagination.js?v=20260922-1';d.body.appendChild(s)}catch(e){}}function loadInbox(d){try{if(d.getElementById('outreach-inbox-loader'))return;const s=d.createElement('script');s.id='outreach-inbox-loader';s.src='outreach-inbox.js?v=20260922-1';d.body.appendChild(s)}catch(e){}}function loadWebsiteInquiries(d){try{if(d.getElementById('website-inquiries-loader'))return;const s=d.createElement('script');s.id='website-inquiries-loader';s.src='website-inquiries.js?v=20260922-1';d.body.appendChild(s)}catch(e){}}function enhance(d,w){addBlessing(d,w);cleanOutreach(d);removeUnusedTabs(d);cleanNav(d);loadPagination(d);loadInbox(d);loadWebsiteInquiries(d);d.querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument){addBlessing(f.contentDocument,f.contentWindow);cleanOutreach(f.contentDocument);removeUnusedTabs(f.contentDocument);cleanNav(f.contentDocument)}}catch(e){};if(!f.dataset.blessWatch){f.dataset.blessWatch='1';f.addEventListener('load',()=>{try{addBlessing(f.contentDocument,f.contentWindow);cleanOutreach(f.contentDocument);removeUnusedTabs(f.contentDocument);cleanNav(f.contentDocument)}catch(e){}})}})}hub.addEventListener('load',function(){try{const d=this.contentDocument,w=this.contentWindow;['country-enhancement-loader','shared-sync-fix-loader','latest-leads-first-loader'].forEach(id=>d.getElementById(id)?.remove());const country=d.createElement('script');country.id='country-enhancement-loader';country.src='country-enhancement.js?v=20260922-inquiries1';country.onload=()=>{const latest=d.createElement('script');latest.id='latest-leads-first-loader';latest.src='latest-leads-first.js?v=20260922-inquiries1';latest.onload=()=>{const sync=d.createElement('script');sync.id='shared-sync-fix-loader';sync.src='shared-sync-fix.js?v=20260922-inquiries1';sync.onload=async()=>{await refreshSharedPipeline()};d.body.appendChild(sync)};d.body.appendChild(latest)};d.body.appendChild(country);enhance(d,w);setInterval(()=>enhance(d,w),500)}catch(e){console.error(e)}});window.addEventListener('focus',refreshSharedPipeline);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshSharedPipeline()});setInterval(refreshSharedPipeline,10000);</script></body></html>
