nterval(t)}},100)})}hub.addEventListener('load',function(){try{const d=this.contentDocument;['country-enhancement-loader','shared-sync-fix-loader','latest-leads-first-loader'].forEach(id=>d.getElementById(id)?.remove());const country=d.createElement('script');country.id='country-enhancement-loader';country.src='country-enhancement.js?v=20260922-blessing2';country.onload=()=>{const latest=d.createElement('script');latest.id='latest-leads-first-loader';latest.src='latest-leads-first.js?v=20260922-blessing2';latest.onload=()=>{const sync=d.createElement('script');sync.id='shared-sync-fix-loader';sync.src='shared-sync-fix.js?v=20260922-blessing2';sync.onload=async()=>{await refreshSharedPipeline();setTimeout(refreshSharedPipeline,1200)};d.body.appendChild(sync)};d.body.appendChild(latest)};d.body.appendChild(country);enhanceLilo(d);const obs=new MutationObserver(()=>enhanceLilo(d));obs.observe(d.body,{childList:true,subtree:true})}catch(e){console.error('Workspace enhancements could not load',e)}});window.addEventListener('focus',refreshSharedPipeline);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshSharedPipeline()});setInterval(refreshSharedPipeline,10000);</script></body></html>
