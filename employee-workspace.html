<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>VYRA Employee Workspace</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="hub" src="index.html?v=20260922-blessing3" title="VYRA Data Hub"></iframe><script>const hub=document.getElementById('hub');let refreshBusy=false;async function refreshSharedPipeline(){if(refreshBusy)return;try{const w=hub.contentWindow;if(typeof w.syncFromServer==='function'){refreshBusy=true;await w.syncFromServer(false)}}catch(e){}finally{refreshBusy=false}}function addBlessing(d,w){try{const nav=d.querySelector('.empnav');if(!nav)return false;const name='Blessing Chisom Eze';if(!nav.querySelector('[data-emp="Blessing Chisom Eze"]')){const b=d.createElement('button');b.className='tab';b.dataset.emp=name;b.textContent=name;b.onclick=function(){if(typeof w.pickEmp==='function')w.pickEmp(this)};const att=[...nav.querySelectorAll('button')].find(x=>x.textContent.includes('Attendance'));att?nav.insertBefore(b,att):nav.appendChild(b)}const filter=d.getElementById('empFilter');if(filter&&![...filter.options].some(o=>o.value===name)){const o=d.createElement('option');o.value=name;o.textContent=name;filter.appendChild(o)}try{if(Array.isArray(w.EMP)&&!w.EMP.includes(name))w.EMP.push(name)}catch(e){}return true}catch(e){return false}}function enhance(d,w){addBlessing(d,w);d.querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument)addBlessing(f.contentDocument,f.contentWindow)}catch(e){};if(!f.dataset.blessWatch){f.dataset.blessWatch='1';f.addEventListener('load',()=>{try{addBlessing(f.contentDocument,f.contentWindow)}catch(e){}})}})}hub.addEventListener('load',function(){try{const d=this.contentDocument,w=this.contentWindow;['country-enhancement-loader','shared-sync-fix-loader','latest-leads-first-loader'].forEach(id=>d.getElementById(id)?.remove());const country=d.createElement('script');country.id='country-enhancement-loader';country.src='country-enhancement.js?v=20260922-blessing3';country.onload=()=>{const latest=d.createElement('script');latest.id='latest-leads-first-loader';latest.src='latest-leads-first.js?v=20260922-blessing3';latest.onload=()=>{const sync=d.createElement('script');sync.id='shared-sync-fix-loader';sync.src='shared-sync-fix.js?v=20260922-blessing3';sync.onload=async()=>{await refreshSharedPipeline()};d.body.appendChild(sync)};d.body.appendChild(latest)};d.body.appendChild(country);enhance(d,w);setInterval(()=>enhance(d,w),500)}catch(e){console.error(e)}});window.addEventListener('focus',refreshSharedPipeline);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshSharedPipeline()});setInterval(refreshSharedPipeline,10000);</script></body></html>
