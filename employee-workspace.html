<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYRA Employee Workspace</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="hub" src="index.html?v=20260922-sync2" title="VYRA Data Hub"></iframe><script>const hub=document.getElementById('hub');function refreshSharedPipeline(){try{const w=hub.contentWindow;if(typeof w.syncFromServer==='function')w.syncFromServer(false)}catch(e){console.warn('Shared pipeline refresh skipped',e)}}hub.addEventListener('load',function(){try{const d=this.contentDocument;if(!d.getElementById('country-enhancement-loader')){const s=d.createElement('script');s.id='country-enhancement-loader';s.src='country-enhancement.js?v=20260922-sync2';s.onload=()=>{refreshSharedPipeline();setTimeout(refreshSharedPipeline,1500)};d.body.appendChild(s)}else{refreshSharedPipeline()}}catch(e){console.error('Country enhancement could not load',e)}});window.addEventListener('focus',refreshSharedPipeline);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshSharedPipeline()});setInterval(refreshSharedPipeline,15000);</script></body></html>
