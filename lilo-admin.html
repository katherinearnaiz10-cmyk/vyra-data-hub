<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>VYRA Admin LILO</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#07152f}iframe{display:block}</style></head><body><iframe id="app" src="lilo.html?v=20261004-remove-attendance-action-column-3"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;function add(){try{const name='Blessing Chisom Eze',nav=d.querySelector('.empnav');if(nav&&typeof w.pickEmp==='function'&&!nav.querySelector('[data-emp="Blessing Chisom Eze"]')){const b=d.createElement('button');b.className='tab';b.setAttribute('data-emp',name);b.textContent=name;b.addEventListener('click',function(){w.pickEmp(this)});const attendance=[...nav.querySelectorAll('button')].find(x=>x.textContent.includes('Attendance'));attendance?nav.insertBefore(b,attendance):nav.appendChild(b)}const filter=d.getElementById('empFilter');if(filter&&![...filter.options].some(o=>o.value===name)){const o=d.createElement('option');o.value=name;o.textContent=name;filter.appendChild(o)}if(!d.getElementById('removeAttendanceEditButtons')){const style=d.createElement('style');style.id='removeAttendanceEditButtons';style.textContent='#attendanceRows td:last-child,#attendanceRows th:last-child{display:none!important}#attendanceRows button{display:none!important}';d.head.appendChild(style)}return true}catch(e){console.error(e);return false}}let tries=0;const t=setInterval(()=>{tries++;if(add()||tries>200)clearInterval(t)},100);add()};</script></body></html>
