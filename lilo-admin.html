<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>VYRA Admin LILO</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#07152f}iframe{display:block}</style></head><body><iframe id="app" src="lilo.html?v=20260922-blessing-admin2"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;function add(){try{const name='Blessing Chisom Eze',nav=d.querySelector('.empnav');if(!nav||typeof w.pickEmp!=='function')return false;if(!nav.querySelector('[data-emp="Blessing Chisom Eze"]')){const b=d.createElement('button');b.className='tab';b.setAttribute('data-emp',name);b.textContent='Blessing Chisom Eze';b.addEventListener('click',function(){w.pickEmp(this)});const attendance=[...nav.querySelectorAll('button')].find(x=>x.textContent.includes('Attendance'));attendance?nav.insertBefore(b,attendance):nav.appendChild(b)}const filter=d.getElementById('empFilter');if(filter&&![...filter.options].some(o=>o.value===name)){const o=d.createElement('option');o.value=name;o.textContent=name;filter.appendChild(o)}return !!nav.querySelector('[data-emp="Blessing Chisom Eze"]')}catch(e){console.error(e);return false}}let tries=0;const t=setInterval(()=>{tries++;if(add()||tries>100)clearInterval(t)},100);add()};</script></body></html>
