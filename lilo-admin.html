<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>VYRA Admin LILO</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#07152f}iframe{display:block}</style></head><body><iframe id="app" src="lilo.html?v=20260922-blessing-admin1"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;function add(){try{if(typeof w.EMP==='undefined')return false;const name='Blessing Chisom Eze';if(!w.EMP.includes(name))w.EMP.push(name);const nav=d.querySelector('.empnav'),attendance=[...nav.querySelectorAll('button')].find(b=>b.textContent.includes('Attendance'));if(!nav.querySelector('[data-emp="Blessing Chisom Eze"]')){const b=d.createElement('button');b.className='tab';b.dataset.emp=name;b.textContent='Blessing Chisom Eze';b.onclick=function(){w.pickEmp(this)};nav.insertBefore(b,attendance)}const filter=d.getElementById('empFilter');if(filter&&![...filter.options].some(o=>o.value===name||o.text===name)){const o=d.createElement('option');o.textContent=name;o.value=name;filter.appendChild(o)}return true}catch(e){return false}}if(!add()){const t=setInterval(()=>{if(add())clearInterval(t)},100);setTimeout(()=>clearInterval(t),10000)}};</script></body></html>
