<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>VYRA Admin LILO</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#07152f}iframe{display:block}</style></head><body><iframe id="app" src="lilo.html?v=20261004-independent-edit-2"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;const EMP='Blessing Chisom Eze';function pad(n){return String(n).padStart(2,'0')}function toDate(v){if(!v)return'';const m=String(v).match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];const x=new Date(v);return isNaN(x)?'':new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).format(x)}function timeForInput(dateText,timeText){if(!timeText||timeText==='—')return'';let m=String(timeText).match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i);if(!m)return'';let h=+m[1],mi=+m[2],ap=(m[3]||'').toUpperCase();if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;return dateText+'T'+pad(h)+':'+pad(mi)}function setValue(id,v){const e=d.getElementById(id);if(e)e.value=v||''}function openIndependentEdit(row){try{const cells=row.querySelectorAll('td');const date=toDate(cells[0]?.textContent.trim());const employee=(cells[1]?.textContent||EMP).trim();const login=(cells[4]?.textContent||'').trim();const logout=(cells[5]?.textContent||'').trim();const wot=(cells[9]?.textContent||'').replace(/[^0-9.]/g,'');const rot=(cells[10]?.textContent||'').replace(/[^0-9.]/g,'');setValue('editDate',date);setValue('editEmployee',employee);setValue('editLogin',timeForInput(date,login));setValue('editLogout',timeForInput(date,logout));const day=new Date(date+'T12:00:00').getDay();setValue('editWot',day===0||day===6?'':wot);setValue('editRot',day===0||day===6?rot:'');const modal=d.getElementById('editModal');if(modal)modal.classList.add('open');configureOtFields();}catch(e){console.error(e)}}function configureOtFields(){try{const modal=d.getElementById('editModal');if(!modal||!modal.classList.contains('open'))return;const date=d.getElementById('editDate')?.value;if(!date)return;const day=new Date(date+'T12:00:00').getDay();const w=d.getElementById('editWot')?.closest('.f'),r=d.getElementById('editRot')?.closest('.f');if(day===0||day===6){if(w)w.style.display='none';if(r)r.style.display='flex';const l=r?.querySelector('label');if(l)l.textContent='Rest Day OT Hours'}else{if(r)r.style.display='none';if(w)w.style.display='flex';const l=w?.querySelector('label');if(l)l.textContent='Weekday OT Hours'}}catch(e){}}function add(){try{const nav=d.querySelector('.empnav');if(nav&&typeof w.pickEmp==='function'&&!nav.querySelector('[data-emp="Blessing Chisom Eze"]')){const b=d.createElement('button');b.className='tab';b.setAttribute('data-emp',EMP);b.textContent=EMP;b.onclick=()=>w.pickEmp(b);const a=[...nav.querySelectorAll('button')].find(x=>x.textContent.includes('Attendance'));a?nav.insertBefore(b,a):nav.appendChild(b)}const filter=d.getElementById('empFilter');if(filter&&!Array.from(filter.options).some(o=>o.value===EMP)){const o=d.createElement('option');o.value=EMP;o.textContent=EMP;filter.appendChild(o)}const ee=d.getElementById('editEmployee');if(ee&&!Array.from(ee.options).some(o=>o.value===EMP)){const o=d.createElement('option');o.value=EMP;o.textContent=EMP;ee.appendChild(o)}if(!d.getElementById('attendanceEditStyle')){const s=d.createElement('style');s.id='attendanceEditStyle';s.textContent='#attendanceRows .vyra-edit-cell{display:table-cell!important}#attendanceRows .vyra-edit-btn{display:inline-block!important;background:#e7c979;color:#07142e;border:1px solid #e7c979;border-radius:999px;padding:7px 11px;font-weight:800;cursor:pointer;white-space:nowrap}';d.head.appendChild(s)}const rows=d.getElementById('attendanceRows');if(rows){rows.querySelectorAll('tr').forEach(row=>{if(row.dataset.vyraEditAdded)return;if(row.querySelector('td')){const cell=d.createElement('td');cell.className='vyra-edit-cell';const btn=d.createElement('button');btn.type='button';btn.className='vyra-edit-btn';btn.textContent='Edit';btn.addEventListener('click',()=>openIndependentEdit(row));cell.appendChild(btn);row.appendChild(cell);row.dataset.vyraEditAdded='1'}})}configureOtFields();return true}catch(e){console.error(e);return false}}const observer=new MutationObserver(()=>add());observer.observe(d.documentElement,{subtree:true,childList:true});let tries=0;const t=setInterval(()=>{tries++;add();if(tries>300)clearInterval(t)},200);add()};</script></body></html>
