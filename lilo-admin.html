<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>VYRA Admin LILO</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#07152f}iframe{display:block}</style></head><body><iframe id="app" src="lilo.html?v=20261004-working-attendance-edit-1"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;function add(){try{const name='Blessing Chisom Eze',nav=d.querySelector('.empnav');if(nav&&typeof w.pickEmp==='function'&&!nav.querySelector('[data-emp="Blessing Chisom Eze"]')){const b=d.createElement('button');b.className='tab';b.setAttribute('data-emp',name);b.textContent=name;b.addEventListener('click',function(){w.pickEmp(this)});const attendance=[...nav.querySelectorAll('button')].find(x=>x.textContent.includes('Attendance'));attendance?nav.insertBefore(b,attendance):nav.appendChild(b)}const filter=d.getElementById('empFilter');if(filter&&![...filter.options].some(o=>o.value===name)){const o=d.createElement('option');o.value=name;o.textContent=name;filter.appendChild(o)}if(!d.getElementById('attendanceEditStyle')){const style=d.createElement('style');style.id='attendanceEditStyle';style.textContent='#attendanceRows td:last-child,#attendanceRows th:last-child{display:none!important}#attendanceRows .vyra-edit-cell{display:table-cell!important}#attendanceRows .vyra-edit-btn{display:inline-block!important;background:#e7c979;color:#07142e;border:1px solid #e7c979;border-radius:999px;padding:7px 11px;font-weight:800;cursor:pointer;white-space:nowrap}.vyra-ot-hidden{display:none!important}';d.head.appendChild(style)}const rows=d.getElementById('attendanceRows');if(rows){rows.querySelectorAll('tr').forEach(row=>{if(row.dataset.vyraEditAdded)return;const old=[...row.querySelectorAll('button')].find(b=>(b.textContent||'').trim().toLowerCase()==='edit');if(!old)return;const cell=d.createElement('td');cell.className='vyra-edit-cell';const btn=d.createElement('button');btn.type='button';btn.className='vyra-edit-btn';btn.textContent='Edit';btn.onclick=()=>{old.click();setTimeout(()=>configureOtFields(),50)};cell.appendChild(btn);row.appendChild(cell);row.dataset.vyraEditAdded='1'})}configureOtFields();return true}catch(e){console.error(e);return false}}function configureOtFields(){try{const modal=d.getElementById('editModal');if(!modal||!modal.classList.contains('open'))return;const date=d.getElementById('editDate')?.value;if(!date)return;const day=new Date(date+'T12:00:00').getDay();const wot=d.getElementById('editWot')?.closest('.f');const rot=d.getElementById('editRot')?.closest('.f');if(day===0||day===6){if(wot)wot.classList.add('vyra-ot-hidden');if(rot){rot.classList.remove('vyra-ot-hidden');const l=rot.querySelector('label');if(l)l.textContent='Rest Day OT Hours'}}else{if(rot)rot.classList.add('vyra-ot-hidden');if(wot){wot.classList.remove('vyra-ot-hidden');const l=wot.querySelector('label');if(l)l.textContent='Weekday OT Hours'}}}catch(e){}}const observer=new MutationObserver(()=>{configureOtFields();add()});observer.observe(d.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','value']});let tries=0;const t=setInterval(()=>{tries++;add();if(tries>300)clearInterval(t)},200);add()};</script></body></html>
